version: 2

updates:
  # packages/sim depends on nothing, so nothing here can reach the rules. What
  # this watches is the toolchain: Biome, TypeScript, and Vitest. A break in
  # one of those breaks the checks that hold the rules to their boundary,
  # which is a quieter failure than a break in the rules themselves.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies]
    commit-message:
      prefix: "deps"
    ignore:
      # @types/node stays on the major that matches what actually runs.
      # .nvmrc says 24 because Vercel's newest runtime is 24.
      #
      # A newer major here does not change what runs. It changes what the
      # compiler believes runs. The newer types are a superset of the older
      # ones, so every check still passes, and the tests still execute on the
      # version in .nvmrc. The failure arrives later, when a call that
      # compiled is missing at run time.
      #
      # Raise this when Vercel supports a newer Node, and raise .nvmrc in the
      # same commit.
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: [dependencies, ci]
    commit-message:
      prefix: "ci"
